# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify MoonBit toolchain
        run: python3 scripts/check_toolchain.py

      - name: Update registry index
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Verify README mirrors
        run: cmp README.md README.mbt.md

      - name: Static checks
        run: moon check --target all --deny-warn

      - name: Tests (Wasm)
        run: moon test --target wasm --deny-warn

      - name: Tests (Wasm-GC)
        run: moon test --target wasm-gc --deny-warn

      - name: Tests (JavaScript)
        run: moon test --target js --deny-warn

      - name: Tests (Native core)
        run: moon test --package 404-32/moon-pe-inspect --target native --deny-warn

      - name: Coverage gate
        run: |
          moon coverage analyze -p 404-32/moon-pe-inspect -- -f summary > /tmp/coverage.txt
          python3 scripts/check_coverage.py /tmp/coverage.txt

      - name: Package
        run: moon package

      - name: Reproduce fixtures
        run: |
          python3 scripts/generate_fixtures.py
          git diff --exit-code -- examples

      - name: CLI smoke tests
        run: |
          moon run cmd/main -- inspect examples/minimal-pe32.exe
          moon run cmd/main -- imports examples/minimal-pe32.exe
          moon run cmd/main -- exports examples/minimal-pe32.exe
          moon run cmd/main -- resources examples/minimal-pe32.exe --json
          moon run cmd/main -- relocations examples/minimal-pe32.exe --json
          moon run cmd/main -- delay-imports examples/minimal-pe32.exe --json
          moon run cmd/main -- debug examples/minimal-pe32.exe --json
          moon run cmd/main -- load-config examples/minimal-pe32.exe --json
          moon run cmd/main -- exceptions examples/minimal-pe32.exe --json
          moon run cmd/main -- bound-imports examples/minimal-pe32.exe --json
          moon run cmd/main -- clr examples/minimal-pe32.exe --json
          moon run cmd/main -- certificates examples/minimal-pe32.exe --json
          moon run cmd/main -- overlay examples/minimal-pe32.exe --json
          moon run cmd/main -- checksum examples/minimal-pe32.exe --json
          moon run cmd/main -- rich examples/rich-pe32.exe --json
          moon run cmd/main -- coff examples/minimal-coff.obj --json
          moon run cmd/main -- security examples/minimal-pe32.exe --sarif > /tmp/pe-security.sarif
          python3 -m json.tool /tmp/pe-security.sarif > /dev/null
          moon run cmd/main -- diff examples/minimal-pe32.exe examples/minimal-pe32plus.exe --json
          moon run cmd/main -- security examples/minimal-pe32plus.exe --json

      - name: Security lint gate
        run: |
          set +e
          moon run cmd/main -- lint examples/minimal-pe32.exe --json > /tmp/pe-lint.json
          status=$?
          set -e
          test "$status" -ne 0
          python3 -m json.tool /tmp/pe-lint.json > /dev/null
          grep -q '"passed":false' /tmp/pe-lint.json

      - name: Full CLI contract verification
        run: python3 scripts/verify_cli.py
